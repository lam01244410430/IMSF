# Frontend CI — job riêng, không động tới job Python (design doc §8.8).
#
# Lệch so với doc §8.8 (ghi rõ lý do):
# - paths dùng `frontend/**` (doc ghi `imsf-frontend/**` — repo thực tế
#   scaffold một thư mục `frontend/` ở root, theo task Phase B).
# - Thứ tự build: `build:h5` TRƯỚC, `build:weapp` SAU — Taro 4.3.3 webpack5
#   không có per-target outputRoot, cả hai build đều ghi vào `dist/`, build
#   sau ghi đè build trước; weapp cuối để `dist/` là artifact Mini Program
#   cho DevTools (phát hiện Gate 0, ghi trong frontend/README.md).
# - Thêm `theme:check` (doc không liệt kê) — tokens.css/nutui.css sinh từ
#   tokens.ts, CI phải bắt khi file sinh ra lệch khỏi source.
# - `npm ci` có `--legacy-peer-deps`: vite 8 (vitest peer) xung đột với
#   peerOptional `vite@^4` của @tarojs/plugin-framework-react@4.3.3
#   (ERESOLVE khi cài sạch — đã kiểm chứng Step 6); vite không dùng bởi
#   build webpack5 nên flag này an toàn.
# - KHÔNG dùng `--registry=https://registry.npmmirror.com` trên CI:
#   run đầu (66ae73b) fail ở bước Install trên GitHub runner trong khi cùng
#   lệnh cài sạch thành công ở Oregon (fresh clone, 25s) — npmmirror từ
#   mạng GitHub không ổn định; registry mặc định (npmjs) là lựa chọn an
#   toàn cho runner. (Oregon local vẫn có thể dùng npmmirror khi cài tay.)
# - P3-01: thêm job `web` cho website mới (Vite + React + DaisyUI).
#   `web/` KHÔNG cần `--legacy-peer-deps`: tổ hợp pin (vite 8.3.8 +
#   @vitejs/plugin-react 6.3.0 + react 18.3.1 + tailwindcss 4.3.0 +
#   daisyui 5.8.2) cài sạch bằng `npm ci` thường trên Oregon, không
#   xung đột peer (kiểm chứng P3-01, log /tmp/p3-scaffold.log).
name: Frontend CI

on:
  push:
    paths:
      - 'frontend/**'
      - 'web/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'web/**'
      - '.github/workflows/frontend.yml'

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Typecheck
        run: npm run typecheck
      - name: Theme check
        run: npm run theme:check
      - name: Lint
        run: npm run lint
      - name: Unit + component tests
        run: npm run test -- --run
      - name: Build H5
        run: npm run build:h5
      - name: Build weapp
        run: npm run build:weapp
      - name: Platform twins check
        run: node scripts/check-platform-twins.mjs
      - name: Bundle size check
        run: node scripts/check-bundle-size.mjs

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit + component tests
        run: npm run test -- --run
      - name: Build
        run: npm run build
