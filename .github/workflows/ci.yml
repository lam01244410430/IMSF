# GitHub Actions workflow. Local verification is recorded separately;
# remote success requires a completed workflow run for the published commit.
name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: p02_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/p02_test_ci
      P02_DISPOSABLE_DATABASE: p02_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: pip install -e .[test]
      # Revisions 7-8 fail closed without two named non-owner roles
      # (FINANCE_RUNTIME_ROLE, INVENTORY_EXPIRY_WORKER_ROLE); the CI
      # database has only the postgres superuser, so create NOLOGIN
      # roles here. They are never used to connect in this workflow.
      - name: Prepare CI roles
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.begin() as conn:
              conn.execute(text("CREATE ROLE ci_runtime NOLOGIN"))
              conn.execute(text("CREATE ROLE ci_expiry_worker NOLOGIN"))
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("FINANCE_RUNTIME_ROLE=ci_runtime\n")
              env.write("INVENTORY_EXPIRY_WORKER_ROLE=ci_expiry_worker\n")
          PY
      - name: Health tests
        run: python -m pytest tests/test_health.py -v
      - name: Fresh-DB Alembic test
        run: python -m pytest tests/test_migration.py -v
      - name: Syntax check
        run: python -m compileall app alembic migrations tests
  full-suite:
    # Full test suite (1210 tests). Runs here instead of on the EC2
    # t3.micro, where the same suite takes 30-40 min and starves RAM
    # (pytest alone takes ~460MB of 909MB). EC2 runs targeted tests
    # only; the full suite is verified by this job on every push.
    # Separate job (own fresh service DB) because test_migration.py
    # requires a fresh database and the smoke job above migrates its DB.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: p02_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/p02_test_ci
      P02_DISPOSABLE_DATABASE: p02_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: pip install -e .[test]
      # The finance tests need a second, operator-provisioned disposable
      # DB (P03) plus a LOGIN runtime role, exactly as the EC2 test
      # drivers provision them. Without these the finance_database_urls
      # session fixture refuses and all ~900 tests using fixture `f`
      # error at setup (CI run #28). Revisions 7-8 fail closed without
      # the two named non-owner roles; the runtime role must be LOGIN
      # here because the tests connect as it, unlike the smoke job
      # where NOLOGIN roles only satisfy the migration preflights.
      # The identity tables get no grants from any migration, so this
      # step also issues the EC2 provisioner's default-privileges
      # grants in the finance DB and the three rehearsal DBs, creates
      # the P03/P04/P05 rehearsal DBs the migration rehearsal fixtures
      # require, and exports the worker credential the expiry worker
      # test connects with (LOGIN here; trust auth, no password).
      - name: Prepare CI finance DB
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.connect() as conn:
              conn = conn.execution_options(isolation_level="AUTOCOMMIT")
              conn.execute(text("CREATE DATABASE p03_finance_test_ci"))
              conn.execute(text("CREATE ROLE ci_finance_runtime LOGIN"))
              conn.execute(text("CREATE ROLE ci_expiry_worker LOGIN"))
              conn.execute(text("CREATE DATABASE p03_rehearsal_test_ci"))
              conn.execute(text("CREATE DATABASE p04_rehearsal_test_ci"))
              conn.execute(text("CREATE DATABASE p05_rehearsal_test_ci"))
          # Default-privileges grants, mirroring the EC2 provisioner
          # (/tmp/p0601-step5-tester-run.py): no migration grants the
          # identity tables, so the runtime role needs DML on every
          # table the migrator creates. Issued by postgres (the
          # migrator role) in each fresh DB, before pytest runs.
          for dbname in ("p03_finance_test_ci", "p03_rehearsal_test_ci", "p04_rehearsal_test_ci", "p05_rehearsal_test_ci"):
              db_engine = create_engine("postgresql+psycopg://postgres@localhost:5432/" + dbname)
              with db_engine.connect() as db_conn:
                  db_conn = db_conn.execution_options(isolation_level="AUTOCOMMIT")
                  db_conn.execute(text("REVOKE CREATE ON SCHEMA public FROM PUBLIC"))
                  db_conn.execute(text("GRANT USAGE ON SCHEMA public TO ci_finance_runtime, ci_expiry_worker"))
                  db_conn.execute(text("ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT,INSERT,UPDATE,DELETE ON TABLES TO ci_finance_runtime"))
                  db_conn.execute(text("ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE,SELECT ON SEQUENCES TO ci_finance_runtime"))
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("FINANCE_MIGRATOR_DATABASE_URL=postgresql+psycopg://postgres@localhost:5432/p03_finance_test_ci\n")
              env.write("FINANCE_RUNTIME_DATABASE_URL=postgresql+psycopg://ci_finance_runtime@localhost:5432/p03_finance_test_ci\n")
              env.write("P03_DISPOSABLE_DATABASE=p03_finance_test_ci\n")
              env.write("FINANCE_RUNTIME_ROLE=ci_finance_runtime\n")
              env.write("INVENTORY_EXPIRY_WORKER_ROLE=ci_expiry_worker\n")
              env.write("INVENTORY_EXPIRY_WORKER_DATABASE_URL=postgresql+psycopg://ci_expiry_worker@localhost:5432/p03_finance_test_ci\n")
              env.write("FINANCE_REHEARSAL_DATABASE_URL=postgresql+psycopg://postgres@localhost:5432/p03_rehearsal_test_ci\n")
              env.write("P03_REHEARSAL_DATABASE=p03_rehearsal_test_ci\n")
              env.write("INVENTORY_REHEARSAL_DATABASE_URL=postgresql+psycopg://postgres@localhost:5432/p04_rehearsal_test_ci\n")
              env.write("P04_REHEARSAL_DATABASE=p04_rehearsal_test_ci\n")
              env.write("EXPIRY_REHEARSAL_DATABASE_URL=postgresql+psycopg://postgres@localhost:5432/p05_rehearsal_test_ci\n")
              env.write("P05_REHEARSAL_DATABASE=p05_rehearsal_test_ci\n")
          PY
      - name: Full suite
        run: python -m pytest tests -q
