name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: imsf_v2
          POSTGRES_USER: imsf_v2
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://imsf_v2:test@127.0.0.1:5432/imsf_v2
        run: alembic upgrade head
      - name: Run tests
        run: pytest -q
