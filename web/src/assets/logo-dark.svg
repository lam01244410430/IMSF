<svg xmlns="http://www.w3.org/2000/svg" width="88" height="32" viewBox="0 0 88 32" role="img" aria-label="IMSF">
  <!-- Dark-theme wordmark (Dashboard Phase A, R1): same geometry as
       logo.svg, name in #EDEDE8 (14.6:1 on the dark header). The accent
       square is unchanged — do NOT use filter: invert() on logo.svg,
       it would turn the square cyan. -->
