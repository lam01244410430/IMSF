  <text x="28" y="22" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="600" fill="#EDEDE8">IMSF</text>
</svg>
